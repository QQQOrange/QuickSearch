[workspace]
members = ["qs-macros"]

[package]
name = "qs-hw"
version = "2.9.0"
edition = "2021"
description = "Quick Search 原生宿主（wry + tao 取代 Tauri 运行时）"

[[bin]]
name = "QuickSearch"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"
# 构建期把前端压成一个 deflate 包再嵌进 exe（体积 4.36 MB → 约 1.8 MB）
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dependencies]
qs-macros = { path = "qs-macros" }

# GUI 底座：直接驱动 WebView2，不再经过 Tauri 的框架层。
tao = "0.37"
wry = "0.57"
pollster = "0.3"
raw-window-handle = "0.6"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
open = "5"
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip", "charset", "json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "webp", "gif", "bmp"] }
ort = { version = "=2.0.0-rc.10", features = ["ndarray", "load-dynamic"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ndarray = "0.16"
indexmap = { version = "1.9", default-features = false, features = ["std"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "rand_core"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
windows-core = "0.62"
md5 = "0.8"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_ProcessStatus",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Foundation",
    "Foundation_Collections",
    "Media_Ocr",
    "Globalization",
    "Graphics_Imaging",
    "Security_Cryptography",
    "Storage_Streams",
]

[dependencies.webview2-com]
version = "0.39"

[dependencies.windows-future]
version = "=0.3.2"
default-features = false
features = ["std"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true

# 本地 vendor 的 ureq：让 native-tls(schannel) 成为默认后端，省掉整棵 rustls。
[patch.crates-io]
ureq = { path = "vendor/ureq" }
